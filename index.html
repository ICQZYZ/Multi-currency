<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>多币种费用汇总计算器</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f5f9;
    --card:#ffffff;
    --muted:#64748b;
    --accent:#2563eb;
    --border:#cbd5e1;
    --radius:12px;
    --cell-default-bg:#e2e8f0; /* 默认自动计算/未输入灰色背景 */
    --cell-manual-bg:#ffffff;  /* 手动输入后的浅色高亮背景 */
  }
  *{box-sizing:border-box}
  body{margin:0;background:linear-gradient(180deg,var(--bg),#e2e8f0);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#0f172a;line-height:1.5}
  .app{max-width:1380px;margin:24px auto;padding:16px}
  header{display:flex;align-items:center;gap:16px;margin-bottom:20px}
  .logo{width:46px;height:46px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#60a5fa);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:18px;box-shadow:0 6px 16px rgba(37,99,235,0.2)}
  h1{margin:0;font-size:20px;font-weight:700}
  .toolbar{margin-left:auto;display:flex;gap:8px}
  .btn{background:var(--accent);color:white;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;font-weight:600;transition:all 0.2s;font-size:13px}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid rgba(37,99,235,0.3)}
  .btn.clear{background:#64748b;color:white;padding:5px 8px;font-size:12px;border-radius:6px}
  .btn.del-cur{background:#ef4444;color:white;padding:3px 6px;font-size:11px;border-radius:4px;border:none;cursor:pointer}
  .panel{background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:0 6px 24px rgba(15,23,42,0.05);border:1px solid rgba(226,232,240,0.8)}
  .section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:8px}
  .section-title h2{margin:0;font-size:15px;font-weight:700;color:#1e293b}
  
  /* 动态汇率网格 */
  .rates-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .field{background:#f8fafc;padding:10px 12px;border-radius:8px;border:1px solid #cbd5e1;position:relative}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:500}
  input[type="number"], input[type="text"], select{width:100%;padding:7px 9px;border-radius:6px;border:1px solid #cbd5e1;font-size:13px;outline:none;font-family:inherit}
  input:focus, select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,0.12)}
  .small{font-size:11px;color:var(--muted)}

  /* 单元格视觉区分核心规则 */
  .cell-input{
    width:100%;padding:6px 8px;font-size:13px;border-radius:5px;text-align:right;
    background-color: var(--cell-default-bg); /* 默认灰色 */
    border: 1px solid #cbd5e1;
    color: #475569;
    transition: all 0.2s ease;
  }
  .cell-input.text-left{text-align:left}
  
  /* 手动输入后激活的浅色高亮样式 */
  .cell-input.manual-entered{
    background-color: var(--cell-manual-bg) !important; /* 浅白色 */
    border-color: #3b82f6 !important;
    color: #0f172a !important;
    font-weight: 600;
    box-shadow: 0 1px 4px rgba(37,99,235,0.08);
  }

  /* 表格 */
  .table-box{overflow-x:auto;margin-top:6px;border:1px solid var(--border);border-radius:10px;background:#fff}
  table{width:100%;border-collapse:collapse;min-width:980px}
  th{background:#f1f5f9;color:#334155;font-size:13px;font-weight:600;padding:10px 6px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border)}
  th.calc-header{background:#e0f2fe;color:#0369a1}
  td{padding:6px 6px;font-size:13px;border-bottom:1px solid #f1f5f9;border-right:1px solid #f1f5f9;text-align:center}
  tr:hover td{background:#f8fafc}
  .calc-cell{background:#f8fafc}

  /* 汇总看板网格 */
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:8px}
  .summary-card{background:linear-gradient(135deg,#0f172a,#1e293b);color:white;border-radius:12px;padding:16px 18px;position:relative;overflow:hidden}
  .summary-card .cur-name{font-size:12px;color:#94a3b8;font-weight:600;margin-bottom:4px;text-transform:uppercase}
  .summary-card .cur-val{font-size:22px;font-weight:700;color:#38bdf8;font-variant-numeric:tabular-nums}
  .summary-card .cur-rate{font-size:11px;color:#cbd5e1;margin-top:2px}

  @media(max-width:860px){
    header{flex-wrap:wrap}
    .toolbar{margin-left:0}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">¥$</div>
    <div>
      <h1>多币种费用汇总计算器</h1>
    </div>
    <div class="toolbar">
      <button id="addFeeBtn" class="btn">+ 增加费用项</button>
      <button id="resetAllBtn" class="btn ghost" style="color:#ef4444;border-color:#fca5a5">全部清零</button>
      <button id="exportExcel" class="btn ghost">导出 Excel (.xlsx)</button>
      <button id="exportPdf" class="btn ghost">导出 PDF</button>
    </div>
  </header>

  <!-- 1. 汇率设定与动态币种 -->
  <section class="panel">
    <div class="section-title">
      <h2>1. 汇率设定 (以 USD 为基准，支持自由增加货币)</h2>
      <div>
        <button id="addCurrencyBtn" class="btn" style="padding:4px 10px;font-size:12px">+ 增加货币</button>
      </div>
    </div>
    <div class="rates-container" id="ratesContainer">
      <!-- 固定的 USD -->
      <div class="field">
        <label>基准货币: 美元 (USD)</label>
        <input type="text" value="1.0000" disabled style="background:#e2e8f0;cursor:not-allowed;font-weight:600">
        <span class="small muted">固定基准 (1 USD = 1.00 USD)</span>
      </div>

      <!-- 人民币 CNY (默认 6.60) -->
      <div class="field">
        <label>人民币 (CNY) 汇率</label>
        <input id="rate_cny" type="number" step="any" min="0.0001" value="6.60" onfocus="this.select()">
        <span class="small muted">1 USD = <b id="rate_cny_tip" style="color:var(--accent)">6.60</b> CNY</span>
      </div>

      <!-- 动态货币挂载区 (默认货币A为欧元 EUR) -->
    </div>
  </section>

  <!-- 2. 费用输入清单 -->
  <section class="panel">
    <div class="section-title">
      <h2>2. 费用输入与核算清单 (灰色为默认/自动计算，浅色为您手动输入的单元格)</h2>
      <div class="small muted">点击任意单元格自动全选覆盖；支持在任意币种列直接输入金额，也可由右侧计算得出。</div>
    </div>

    <div class="table-box">
      <table id="mainTable">
        <thead>
          <tr id="tableHeaderRow">
            <!-- 动态生成表头 -->
          </tr>
        </thead>
        <tbody id="feeTableBody">
          <!-- 动态渲染费用1 到 费用10 -->
        </tbody>
      </table>
    </div>
  </section>

  <!-- 3. 多币种汇总看板 -->
  <section class="panel">
    <div class="section-title">
      <h2>3. 费用总计汇总看板 (Grand Total)</h2>
      <div class="small muted">实时统计所有费用项，在所有设定的货币下同步展现。</div>
    </div>

    <div class="summary-grid" id="summaryGrid">
      <!-- 动态渲染各币种总计卡片 -->
    </div>
  </section>
</div>

<!-- 依赖导出库 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
(() => {
  const E = id => document.getElementById(id);

  // 1. 货币定义：默认拥有货币A（欧元 EUR，默认汇率 0.92）
  let customCurrencies = [
    { key: 'EUR', name: 'EUR', rate: 0.92, label: '欧元 (EUR)' }
  ];

  // 2. 初始化 10 项费用，默认总额全部为 0，单价为 0，数量为 1
  let feesData = [];
  for (let i = 1; i <= 10; i++) {
    feesData.push({
      id: i,
      name: `费用${i}`,
      amountUSD: 0,
      unitPrice: 0,
      unitCur: 'USD',
      qty: 1,
      // 记录哪些字段被手动输入过（手动输入则浅色高亮，未输入或自动计算保持灰色）
      manualFields: {} 
    });
  }

  function getRateCNY() {
    return parseFloat(E('rate_cny').value) || 6.60;
  }

  // 渲染顶部汇率配置区
  function renderRates() {
    const container = E('ratesContainer');
    // 保留前两个固定的 USD 和 CNY
    const fixedUSD = container.children[0];
    const fixedCNY = container.children[1];
    container.innerHTML = '';
    container.appendChild(fixedUSD);
    container.appendChild(fixedCNY);

    customCurrencies.forEach((cur, idx) => {
      const div = document.createElement('div');
      div.className = 'field';
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <label style="margin:0">货币 ${idx + 1} (${cur.name})</label>
          <button class="btn del-cur" onclick="deleteCurrency(${idx})">删除</button>
        </div>
        <div style="display:flex;gap:6px">
          <input type="text" value="${cur.name}" style="width:75px;font-weight:600;text-transform:uppercase" onfocus="this.select()" oninput="updateCurrencyMeta(${idx}, 'name', this.value)">
          <input type="number" step="any" min="0.0001" value="${cur.rate}" onfocus="this.select()" oninput="updateCurrencyMeta(${idx}, 'rate', this.value)">
        </div>
        <span class="small muted">1 USD = <b style="color:var(--accent)">${cur.rate}</b> ${cur.name}</span>
      `;
      container.appendChild(div);
    });

    E('rate_cny_tip').textContent = getRateCNY();
  }

  window.updateCurrencyMeta = function(idx, field, val) {
    if (field === 'name') {
      customCurrencies[idx].name = val.trim().toUpperCase() || `CUR${idx+1}`;
    } else {
      customCurrencies[idx].rate = parseFloat(val) || 1.0;
    }
    renderHeader();
    renderTable();
  };

  window.deleteCurrency = function(idx) {
    if (confirm(`确定要删除货币 ${customCurrencies[idx].name} 吗？`)) {
      customCurrencies.splice(idx, 1);
      renderRates();
      renderHeader();
      renderTable();
    }
  };

  // 增加新货币按钮
  E('addCurrencyBtn').addEventListener('click', () => {
    const nextNum = customCurrencies.length + 1;
    customCurrencies.push({
      key: `CUR_${Date.now()}`,
      name: `CUR${nextNum}`,
      rate: 1.0,
      label: `货币${nextNum}`
    });
    renderRates();
    renderHeader();
    renderTable();
  });

  // 渲染表头
  function renderHeader() {
    const tr = E('tableHeaderRow');
    let html = `
      <th style="width:45px">#</th>
      <th style="width:160px">费用项目名称</th>
      <th style="width:130px">金额 (USD $)</th>
      <th style="width:130px">金额 (CNY ¥)</th>
    `;
    customCurrencies.forEach(cur => {
      html += `<th style="width:130px">金额 (${cur.name})</th>`;
    });
    html += `
      <th class="calc-header" style="width:105px">单价</th>
      <th class="calc-header" style="width:95px">单价币种</th>
      <th class="calc-header" style="width:75px">数量</th>
      <th style="width:60px">操作</th>
    `;
    tr.innerHTML = html;
  }

  // 渲染表格主体（默认灰色，手动输入的单元格自动附加 manual-entered 变为浅色）
  function renderTable() {
    const cny = getRateCNY();
    const tbody = E('feeTableBody');
    tbody.innerHTML = '';

    feesData.forEach((row, index) => {
      const uUSD = row.amountUSD || 0;
      const uCNY = (uUSD * cny).toFixed(2);

      // 判断各列是否为手动输入
      const isManualName = row.manualFields['name'] ? 'manual-entered' : '';
      const isManualUSD = row.manualFields['USD'] ? 'manual-entered' : '';
      const isManualCNY = row.manualFields['CNY'] ? 'manual-entered' : '';
      const isManualUnitPrice = row.manualFields['unitPrice'] ? 'manual-entered' : '';
      const isManualQty = row.manualFields['qty'] ? 'manual-entered' : '';

      const tr = document.createElement('tr');

      let curColsHtml = '';
      customCurrencies.forEach((cur, cIdx) => {
        const uCur = (uUSD * cur.rate).toFixed(2);
        const isManualCur = row.manualFields[cur.name] ? 'manual-entered' : '';
        curColsHtml += `
          <td><input type="number" step="any" min="0" class="cell-input ${isManualCur}" value="${uCur > 0 ? Number(uCur) : 0}" placeholder="0" onfocus="this.select()" onblur="handleBlurRecover(this)" oninput="handleAmountInput(${index}, '${cur.name}', this.value)"></td>
        `;
      });

      // 币种下拉列表
      let selectCurHtml = `<option value="USD" ${row.unitCur === 'USD' ? 'selected' : ''}>USD</option>
                           <option value="CNY" ${row.unitCur === 'CNY' ? 'selected' : ''}>CNY</option>`;
      customCurrencies.forEach(cur => {
        selectCurHtml += `<option value="${cur.name}" ${row.unitCur === cur.name ? 'selected' : ''}>${cur.name}</option>`;
      });

      tr.innerHTML = `
        <td style="color:var(--muted)">${index + 1}</td>
        <td><input type="text" class="cell-input text-left ${isManualName}" value="${row.name}" onfocus="this.select()" oninput="updateFeeName(${index}, this.value)"></td>
        <td><input type="number" step="any" min="0" class="cell-input ${isManualUSD}" value="${uUSD > 0 ? Number(uUSD.toFixed(2)) : 0}" placeholder="0" onfocus="this.select()" onblur="handleBlurRecover(this)" oninput="handleAmountInput(${index}, 'USD', this.value)"></td>
        <td><input type="number" step="any" min="0" class="cell-input ${isManualCNY}" value="${uCNY > 0 ? Number(uCNY) : 0}" placeholder="0" onfocus="this.select()" onblur="handleBlurRecover(this)" oninput="handleAmountInput(${index}, 'CNY', this.value)"></td>
        ${curColsHtml}
        <td class="calc-cell"><input type="number" step="any" min="0" class="cell-input ${isManualUnitPrice}" value="${row.unitPrice > 0 ? Number(row.unitPrice.toFixed(2)) : 0}" placeholder="0" onfocus="this.select()" onblur="handleBlurRecover(this)" oninput="handleUnitPriceInput(${index}, this.value)"></td>
        <td class="calc-cell">
          <select style="padding:6px;font-size:12px" onchange="handleUnitCurChange(${index}, this.value)">
            ${selectCurHtml}
          </select>
        </td>
        <td class="calc-cell"><input type="number" step="any" min="0.0001" class="cell-input ${isManualQty}" style="text-align:center" value="${row.qty > 0 ? row.qty : 1}" placeholder="1" onfocus="this.select()" onblur="handleBlurRecover(this, 1)" oninput="handleQtyInput(${index}, this.value)"></td>
        <td><button class="btn clear" onclick="clearRow(${index})">清零</button></td>
      `;
      tbody.appendChild(tr);
    });

    calculateGrandTotal();
  }

  window.handleBlurRecover = function(el, defaultVal = 0) {
    if (el.value.trim() === '') {
      el.value = defaultVal;
    }
  };

  window.updateFeeName = function(index, val) {
    if (feesData[index]) {
      feesData[index].name = val;
      feesData[index].manualFields['name'] = true;
      markInputManual(E('feeTableBody').children[index].querySelectorAll('input')[0]);
    }
  };

  function markInputManual(el) {
    if (el && !el.classList.contains('manual-entered')) {
      el.classList.add('manual-entered');
    }
  }

  // 直接输入金额 -> 只有输入的单元格变成浅色，其他自动联动的保持灰色
  window.handleAmountInput = function(index, curType, val) {
    const cny = getRateCNY();
    const v = parseFloat(val) || 0;
    let baseUSD = 0;

    if (curType === 'USD') {
      baseUSD = v;
    } else if (curType === 'CNY') {
      baseUSD = v / cny;
    } else {
      const curObj = customCurrencies.find(c => c.name === curType);
      const r = curObj ? curObj.rate : 1.0;
      baseUSD = v / r;
    }

    feesData[index].amountUSD = baseUSD;

    // 清理该行除当前输入格外的金额手工标记
    Object.keys(feesData[index].manualFields).forEach(k => {
      if (k === 'USD' || k === 'CNY' || customCurrencies.some(c => c.name === k)) {
        delete feesData[index].manualFields[k];
      }
    });
    // 标记当前单元格为手动输入
    feesData[index].manualFields[curType] = true;

    // 反推单价 (右侧单价不作为手动输入，保持灰色)
    const qty = feesData[index].qty || 1;
    const curOfUnit = feesData[index].unitCur || 'USD';
    let rateOfUnit = 1.0;
    if (curOfUnit === 'CNY') rateOfUnit = cny;
    else {
      const curObj = customCurrencies.find(c => c.name === curOfUnit);
      if (curObj) rateOfUnit = curObj.rate;
    }
    feesData[index].unitPrice = (baseUSD * rateOfUnit) / qty;

    syncRowInputs(index, curType, true);
    calculateGrandTotal();
  };

  // 右侧单价输入
  window.handleUnitPriceInput = function(index, val) {
    feesData[index].unitPrice = parseFloat(val) || 0;
    feesData[index].manualFields['unitPrice'] = true;
    recalcAmountFromUnitAndQty(index);
  };

  window.handleUnitCurChange = function(index, curVal) {
    feesData[index].unitCur = curVal;
    recalcAmountFromUnitAndQty(index);
  };

  // 右侧数量输入
  window.handleQtyInput = function(index, val) {
    feesData[index].qty = parseFloat(val) || 0;
    feesData[index].manualFields['qty'] = true;
    recalcAmountFromUnitAndQty(index);
  };

  // 右侧计算推导金额：金额由单价推导出，因此金额列保持灰色自动计算状态
  function recalcAmountFromUnitAndQty(index) {
    const cny = getRateCNY();
    const row = feesData[index];
    const qty = row.qty || 0;
    const uPrice = row.unitPrice || 0;
    const totalRow = qty * uPrice;

    let baseUSD = totalRow;
    if (row.unitCur === 'CNY') baseUSD = totalRow / cny;
    else if (row.unitCur !== 'USD') {
      const curObj = customCurrencies.find(c => c.name === row.unitCur);
      if (curObj) baseUSD = totalRow / curObj.rate;
    }

    row.amountUSD = baseUSD;

    // 清除左侧直接输入的浅色标记，使金额恢复灰色自动计算状态
    Object.keys(row.manualFields).forEach(k => {
      if (k === 'USD' || k === 'CNY' || customCurrencies.some(c => c.name === k)) {
        delete row.manualFields[k];
      }
    });

    syncRowInputs(index, 'CALC', false);
    calculateGrandTotal();
  }

  function syncRowInputs(index, source, syncUnitBox) {
    const cny = getRateCNY();
    const tr = E('feeTableBody').children[index];
    if (!tr) return;

    const row = feesData[index];
    const baseUSD = row.amountUSD || 0;
    const inputs = tr.querySelectorAll('input');

    // 0:name, 1:USD, 2:CNY, 3...(3+N-1):CustomCurrencies, (3+N):unitPrice, (4+N):qty
    const N = customCurrencies.length;

    // USD
    if (source !== 'USD') {
      inputs[1].value = baseUSD > 0 ? Number(baseUSD.toFixed(2)) : 0;
      inputs[1].classList.toggle('manual-entered', !!row.manualFields['USD']);
    } else {
      inputs[1].classList.add('manual-entered');
    }

    // CNY
    if (source !== 'CNY') {
      inputs[2].value = (baseUSD * cny) > 0 ? Number((baseUSD * cny).toFixed(2)) : 0;
      inputs[2].classList.toggle('manual-entered', !!row.manualFields['CNY']);
    } else {
      inputs[2].classList.add('manual-entered');
    }

    // 动态币种
    customCurrencies.forEach((cur, cIdx) => {
      const inputIdx = 3 + cIdx;
      if (source !== cur.name) {
        inputs[inputIdx].value = (baseUSD * cur.rate) > 0 ? Number((baseUSD * cur.rate).toFixed(2)) : 0;
        inputs[inputIdx].classList.toggle('manual-entered', !!row.manualFields[cur.name]);
      } else {
        inputs[inputIdx].classList.add('manual-entered');
      }
    });

    const unitPriceInput = inputs[3 + N];
    const qtyInput = inputs[4 + N];

    if (syncUnitBox) {
      unitPriceInput.value = row.unitPrice > 0 ? Number(row.unitPrice.toFixed(2)) : 0;
      unitPriceInput.classList.toggle('manual-entered', !!row.manualFields['unitPrice']);
    } else {
      unitPriceInput.classList.toggle('manual-entered', !!row.manualFields['unitPrice']);
    }
    qtyInput.classList.toggle('manual-entered', !!row.manualFields['qty']);
  }

  // 清零恢复灰色
  window.clearRow = function(index) {
    if (feesData[index]) {
      feesData[index].amountUSD = 0;
      feesData[index].unitPrice = 0;
      feesData[index].qty = 1;
      feesData[index].manualFields = {}; // 清空所有手动浅色高亮标记

      const tr = E('feeTableBody').children[index];
      if (tr) {
        const inputs = tr.querySelectorAll('input');
        inputs.forEach((input, i) => {
          if (i === 0) return; // 保留名称
          input.classList.remove('manual-entered'); // 恢复灰色
          if (i === inputs.length - 1) input.value = 1; // 数量为1
          else input.value = 0;
        });
      }
      calculateGrandTotal();
    }
  };

  // 计算多币种汇总并更新看板
  function calculateGrandTotal() {
    const cny = getRateCNY();
    let grandUSD = 0;
    feesData.forEach(r => grandUSD += (r.amountUSD || 0));

    const grandCNY = grandUSD * cny;

    const summaryGrid = E('summaryGrid');
    summaryGrid.innerHTML = `
      <div class="summary-card">
        <div class="cur-name">美元总计 (USD $)</div>
        <div class="cur-val">$ ${grandUSD.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
        <div class="cur-rate">基准基数 (Base)</div>
      </div>
      <div class="summary-card">
        <div class="cur-name">人民币总计 (CNY ¥)</div>
        <div class="cur-val">¥ ${grandCNY.toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2})}</div>
        <div class="cur-rate">汇率: 1 USD = ${cny} CNY</div>
      </div>
    `;

    customCurrencies.forEach(cur => {
      const grandCur = grandUSD * cur.rate;
      const card = document.createElement('div');
      card.className = 'summary-card';
      card.innerHTML = `
        <div class="cur-name">${cur.name} 总计</div>
        <div class="cur-val">${grandCur.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${cur.name}</div>
        <div class="cur-rate">汇率: 1 USD = ${cur.rate} ${cur.name}</div>
      `;
      summaryGrid.appendChild(card);
    });
  }

  // 增加费用项
  E('addFeeBtn').addEventListener('click', () => {
    const nextIdx = feesData.length + 1;
    feesData.push({
      id: nextIdx,
      name: `费用${nextIdx}`,
      amountUSD: 0,
      unitPrice: 0,
      unitCur: 'USD',
      qty: 1,
      manualFields: {}
    });
    renderTable();
  });

  // 全部清零
  E('resetAllBtn').addEventListener('click', () => {
    if (confirm('确定要清零所有费用金额，并将单元格全部恢复为默认灰色吗？')) {
      feesData.forEach(r => {
        r.amountUSD = 0;
        r.unitPrice = 0;
        r.qty = 1;
        r.manualFields = {};
      });
      renderTable();
    }
  });

  E('rate_cny').addEventListener('input', () => {
    E('rate_cny_tip').textContent = getRateCNY();
    feesData.forEach((_, idx) => recalcAmountFromUnitAndQty(idx));
    renderTable();
  });

  // 导出 Excel (.xlsx)
  E('exportExcel').addEventListener('click', () => {
    const cny = getRateCNY();
    const dateStr = new Date().toISOString().slice(0,10);

    let rateDescs = `1 USD = ${cny} CNY`;
    customCurrencies.forEach(c => rateDescs += ` | 1 USD = ${c.rate} ${c.name}`);

    const headerRow = ['#', '费用项目名称', '总金额 (USD $)', '总金额 (CNY ¥)'];
    customCurrencies.forEach(c => headerRow.push(`总金额 (${c.name})`));
    headerRow.push('参考单价', '单价币种', '数量');

    const sheetData = [
      ['多币种费用汇总核算表 (Multi-Currency Expense Summary)', '', '', '', '', '', '', ''],
      ['导出日期', dateStr, '汇率设定', rateDescs, '', '', '', ''],
      ['', '', '', '', '', '', '', ''],
      headerRow
    ];

    let grandUSD = 0;
    feesData.forEach((r, idx) => {
      const uUSD = r.amountUSD || 0;
      grandUSD += uUSD;
      const row = [
        idx + 1,
        r.name,
        Number(uUSD.toFixed(2)),
        Number((uUSD * cny).toFixed(2))
      ];
      customCurrencies.forEach(c => {
        row.push(Number((uUSD * c.rate).toFixed(2)));
      });
      row.push(Number(r.unitPrice.toFixed(2)), r.unitCur, r.qty);
      sheetData.push(row);
    });

    sheetData.push(['', '', '', '', '', '', '', '', '']);
    sheetData.push(['--- 费用最终汇总 (Grand Totals) ---', '', '', '', '', '', '', '', '']);
    sheetData.push(['美元总计 (USD $)', `$ ${grandUSD.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`, '', '', '', '', '', '', '']);
    sheetData.push(['人民币总计 (CNY ¥)', `¥ ${(grandUSD * cny).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2})}`, '', '', '', '', '', '', '']);
    customCurrencies.forEach(c => {
      sheetData.push([`${c.name} 总计`, `${(grandUSD * c.rate).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} ${c.name}`, '', '', '', '', '', '', '']);
    });

    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(sheetData);

    const cols = [{ wch: 6 }, { wch: 22 }, { wch: 18 }, { wch: 18 }];
    customCurrencies.forEach(() => cols.push({ wch: 18 }));
    cols.push({ wch: 14 }, { wch: 12 }, { wch: 10 });
    ws['!cols'] = cols;
    ws['!views'] = [{ showGridLines: true }];

    XLSX.utils.book_append_sheet(wb, ws, "费用汇总表");
    XLSX.writeFile(wb, `多币种费用汇总_${dateStr}.xlsx`);
  });

  // 导出 PDF
  E('exportPdf').addEventListener('click', () => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
    const cny = getRateCNY();

    doc.setFillColor(30, 41, 59);
    doc.rect(0, 0, 297, 20, 'F');
    doc.setTextColor(255, 255, 255);
    doc.setFontSize(14);
    doc.text('Multi-Currency Expense & Cost Summary', 14, 13);

    doc.setTextColor(71, 85, 105);
    doc.setFontSize(8.5);
    let rateDescs = `1 USD = ${cny} CNY`;
    customCurrencies.forEach(c => rateDescs += `  |  1 USD = ${c.rate} ${c.name}`);
    doc.text(`Date: ${new Date().toLocaleDateString()}  |  Rates: ${rateDescs}`, 14, 27);

    const headers = ['#', 'Expense Item', 'USD ($)', 'CNY (¥)'];
    customCurrencies.forEach(c => headers.push(c.name));
    headers.push('Unit Price', 'Qty');

    let grandUSD = 0;
    const bodyData = feesData.map((r, idx) => {
      const uUSD = r.amountUSD || 0;
      grandUSD += uUSD;
      const row = [
        idx + 1,
        r.name,
        `$ ${uUSD.toFixed(2)}`,
        `¥ ${(uUSD * cny).toFixed(2)}`
      ];
      customCurrencies.forEach(c => {
        row.push(`${(uUSD * c.rate).toFixed(2)}`);
      });
      row.push(`${r.unitPrice.toFixed(2)} ${r.unitCur}`, r.qty);
      return row;
    });

    doc.autoTable({
      startY: 32,
      head: [headers],
      body: bodyData,
      theme: 'grid',
      styles: {
        fontSize: 8,
        cellPadding: 1.8,
        valign: 'middle',
        textColor: [15, 23, 42],
        lineColor: [226, 232, 240],
        lineWidth: 0.2
      },
      headStyles: {
        fillColor: [37, 99, 235],
        textColor: [255, 255, 255],
        fontStyle: 'bold',
        halign: 'center'
      },
      alternateRowStyles: {
        fillColor: [248, 250, 252]
      },
      margin: { left: 14, right: 14 }
    });

    let currentY = doc.lastAutoTable.finalY + 8;
    doc.setFillColor(241, 245, 249);
    doc.roundedRect(14, currentY, 269, 28, 3, 3, 'F');

    doc.setTextColor(30, 41, 59);
    doc.setFontSize(10.5);
    doc.text('Grand Total Summary by Currencies:', 18, currentY + 8);

    doc.setFontSize(9.5);
    doc.setTextColor(37, 99, 235);
    let xOffset = 20;
    doc.text(`• USD: $ ${grandUSD.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`, xOffset, currentY + 18);
    xOffset += 65;
    doc.text(`• CNY: ¥ ${(grandUSD * cny).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2})}`, xOffset, currentY + 18);
    
    customCurrencies.forEach(c => {
      xOffset += 65;
      if (xOffset < 260) {
        doc.text(`• ${c.name}: ${(grandUSD * c.rate).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})}`, xOffset, currentY + 18);
      }
    });

    doc.save(`Multi_Currency_Summary_${new Date().toISOString().slice(0,10)}.pdf`);
  });

  // 初始化
  renderRates();
  renderHeader();
  renderTable();
})();
</script>
</body>
</html>
